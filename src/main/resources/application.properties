spring.application.name=MyMovies

# Configuração H2 em Ficheiro Persistente (./data/mymovies.mv.db)
spring.datasource.url=jdbc:h2:file:./data/mymovies;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console Web H2 (Acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do Cliente Externo TMDB
tmdb.base-url=https://api.themoviedb.org/3
tmdb.token=${TMDB_TOKEN:}
